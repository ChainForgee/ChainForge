name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database-provider: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: chainforge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_PROVIDER: ${{ matrix.database-provider }}
      DATABASE_URL: ${{ matrix.database-provider == 'sqlite' && 'file:./prisma/dev.db' || 'postgresql://postgres:password@localhost:5432/chainforge_test?schema=public' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --engine-strict=false

      - name: Lint
        run: pnpm --filter backend run lint

      - name: Validate database migrations
        working-directory: app/backend
        run: |
          if [ "${{ matrix.database-provider }}" = "sqlite" ]; then
            npx prisma migrate deploy
          else
            npx prisma db push
          fi

      - name: Test
        run: pnpm --filter backend run test

      - name: Build
        run: pnpm --filter backend run build

      - name: Export OpenAPI spec
        working-directory: app/backend
        env:
          NODE_ENV: development
        run: npm run spec:export

      - name: Check for OpenAPI spec drift
        run: |
          git diff --exit-code app/frontend/openapi.json || \
            (echo "ERROR: openapi.json is out of date. Run 'npm run spec:export' in app/backend and commit app/frontend/openapi.json." && exit 1)
